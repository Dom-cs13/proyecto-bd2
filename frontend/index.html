<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Red de Salud</title>
  <link rel="stylesheet" href="./shared/css/fuentes.css">
  <style>
    :root {
      --bg: #f4f8f8;
      --text: #1f2937;
      --muted: #64748b;
      --border: #e2ecec;
      --radio-ruleta: 420px;
    }
    /* Tono por institución: cambia el panel, el botón y los acentos */
    .login[data-institucion="hospital"]    { --tono: #00595d; --tono-hover: #007074; --tono-claro: #e0f7f6; }
    .login[data-institucion="odontologia"] { --tono: #1e5a8a; --tono-hover: #2a6fa8; --tono-claro: #e3eefa; }
    .login[data-institucion="laboratorio"] { --tono: #5b4a9e; --tono-hover: #6f5dba; --tono-claro: #ece9f7; }
    .login[data-institucion="pediatria"]   { --tono: #b4562a; --tono-hover: #cc6634; --tono-claro: #fbece4; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      background: #fff;
    }
    .login {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.25fr minmax(420px, 1fr);
      background: #fff;
      overflow: hidden;
    }

    /* ---------- Formulario ---------- */
    .lado-form {
      width: min(460px, 100%);
      justify-self: center;
      padding: 56px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }
    .marca { display: flex; align-items: center; gap: 12px; }
    .marca svg { width: 40px; height: 40px; color: var(--tono); transition: color .6s; }
    .marca strong { display: block; font-size: 1.35rem; color: var(--tono); transition: color .6s; }
    .marca span { font-size: .85rem; color: var(--muted); }

    form { display: flex; flex-direction: column; gap: 18px; }
    .etiqueta { font-size: .85rem; font-weight: 600; margin-bottom: 8px; display: block; }
    .etiqueta b { color: #dc2626; font-weight: 600; }

    .instituciones {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      border: 0;
    }
    .instituciones input { position: absolute; opacity: 0; pointer-events: none; }
    .instituciones label {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .25s;
    }
    .instituciones label:hover { border-color: var(--tono); color: var(--text); }
    .instituciones input:checked + label {
      border-color: var(--tono);
      background: var(--tono-claro);
      color: var(--tono);
    }
    .instituciones input:focus-visible + label { outline: 2px solid var(--tono); outline-offset: 2px; }

    .campo input {
      width: 100%;
      font: inherit;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fbfdfd;
      transition: border-color .2s, box-shadow .2s;
    }
    .campo input:focus {
      outline: none;
      border-color: var(--tono);
      box-shadow: 0 0 0 3px var(--tono-claro);
    }
    .error { color: #b91c1c; font-size: .85rem; min-height: 1.2em; }
    button {
      font: inherit;
      font-weight: 700;
      padding: 13px;
      border: 0;
      border-radius: 999px;
      background: var(--tono);
      color: #fff;
      cursor: pointer;
      transition: background .6s;
    }
    button:hover { background: var(--tono-hover); }
    button:disabled { opacity: .6; cursor: wait; }
    .pie { font-size: .78rem; color: var(--muted); text-align: center; }

    /* ---------- Ruleta de ilustraciones ---------- */
    .lado-ruleta {
      position: relative;
      overflow: hidden;
      background-color: var(--tono);
      background-image:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(0,0,0,.18), transparent 50%);
      color: #fff;
      transition: background-color .9s ease;
    }
    .ruleta {
      position: absolute;
      left: calc(50% - 40px);
      top: calc(46% + var(--radio-ruleta));
      width: 0;
      height: 0;
      transition: transform .9s cubic-bezier(.65, 0, .35, 1);
    }
    .ruleta::before {
      content: '';
      position: absolute;
      width: calc(var(--radio-ruleta) * 2 + 120px);
      height: calc(var(--radio-ruleta) * 2 + 120px);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed rgba(255,255,255,.18);
      border-radius: 50%;
    }
    .ilustracion {
      position: absolute;
      width: 300px;
      height: 300px;
      margin: -150px 0 0 -150px;
      transform: rotate(var(--angulo)) translateY(calc(var(--radio-ruleta) * -1));
      opacity: .25;
      transition: opacity .9s;
    }
    .ilustracion.activa { opacity: 1; }
    .ilustracion svg { width: 100%; height: 100%; }
    .relleno-tono { fill: var(--tono); transition: fill .9s; }
    .relleno-suave { fill: var(--tono-claro); transition: fill .9s; }
    .trazo-tono { stroke: var(--tono); transition: stroke .9s; }
    /* Onda que separa el formulario del panel gráfico */
    .onda {
      position: absolute;
      top: 0; right: -1px;
      width: 120px;
      height: 100%;
      z-index: 1;
    }
    /* Burbujas que suben despacio detrás de la ruleta */
    .burbujas { position: absolute; inset: 0; pointer-events: none; }
    .burbujas span {
      position: absolute;
      bottom: -60px;
      left: var(--x);
      width: var(--t);
      height: var(--t);
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      animation: subir var(--d) linear var(--r) infinite;
    }
    @keyframes subir {
      0%   { transform: translate(0, 0);         opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(18px, -55vh); }
      90%  { opacity: .8; }
      100% { transform: translate(-6px, -112vh); opacity: 0; }
    }
    .leyenda {
      position: absolute;
      left: 0; right: 80px; bottom: 48px;
      text-align: center;
      padding: 0 40px;
    }
    .leyenda h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .leyenda p { font-size: .9rem; opacity: .85; max-width: 360px; margin: 0 auto; }
    .puntos { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .puntos i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); transition: all .4s; }
    .puntos i.activo { width: 22px; border-radius: 4px; background: #fff; }

    @media (max-width: 860px) {
      .login { grid-template-columns: 1fr; }
      .lado-ruleta { display: none; }
      .lado-form { padding: 40px 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ruleta, .ilustracion, .lado-ruleta { transition: none; }
      .burbujas { display: none; }
    }
  </style>
</head>
<body>

  <main class="login" data-institucion="hospital">
    <aside class="lado-ruleta" aria-hidden="true">
      <svg class="onda" viewBox="0 0 120 800" preserveAspectRatio="none">
        <path d="M120 0H50C100 120 5 230 50 380S110 640 45 800H120Z" fill="#fff"/>
      </svg>
      <div class="burbujas">
        <span style="--x: 12%; --t: 14px; --d: 22s; --r: 0s"></span>
        <span style="--x: 28%; --t: 26px; --d: 30s; --r: -8s"></span>
        <span style="--x: 45%; --t: 10px; --d: 19s; --r: -14s"></span>
        <span style="--x: 62%; --t: 34px; --d: 34s; --r: -4s"></span>
        <span style="--x: 78%; --t: 16px; --d: 25s; --r: -18s"></span>
        <span style="--x: 20%; --t: 8px;  --d: 18s; --r: -10s"></span>
        <span style="--x: 70%; --t: 12px; --d: 21s; --r: -26s"></span>
      </div>
      <div class="ruleta" id="ruleta">
        <!-- Hospital General -->
        <div class="ilustracion activa" style="--angulo: 0deg">
          <svg viewBox="0 0 300 300" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
            <circle cx="150" cy="150" r="128" fill="rgba(255,255,255,.08)" stroke="none"/>
            <rect x="70" y="110" width="160" height="120" rx="6" fill="rgba(255,255,255,.12)"/>
            <rect x="115" y="70" width="70" height="40" rx="4" fill="rgba(255,255,255,.18)"/>
            <path d="M144 74h12v10h10v12h-10v10h-12v-10h-10V84h10z" fill="#fff" stroke="none"/>
            <rect x="88" y="130" width="24" height="22" rx="3"/><rect x="138" y="130" width="24" height="22" rx="3"/><rect x="188" y="130" width="24" height="22" rx="3"/>
            <rect x="88" y="168" width="24" height="22" rx="3"/><rect x="188" y="168" width="24" height="22" rx="3"/>
            <path d="M134 230v-44h32v44"/>
            <path d="M40 230h220" stroke-linecap="round"/>
          </svg>
        </div>
        <!-- Clínica Odontológica -->
        <div class="ilustracion" style="--angulo: 90deg">
          <svg viewBox="0 0 300 300" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
            <circle cx="150" cy="150" r="128" fill="rgba(255,255,255,.08)" stroke="none"/>
            <path d="M150 92c-14-12-36-16-52-6-20 13-18 42-10 64 6 17 9 34 12 52 3 18 18 22 24 6 5-14 8-34 26-34s21 20 26 34c6 16 21 12 24-6 3-18 6-35 12-52 8-22 10-51-10-64-16-10-38-6-52 6z" fill="rgba(255,255,255,.16)"/>
            <path d="M118 112c8-6 20-6 28 0"/>
            <path d="M206 70l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff" stroke="none"/>
            <path d="M84 196l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <!-- Laboratorio Clínico -->
        <div class="ilustracion" style="--angulo: 180deg">
          <svg viewBox="0 0 300 300" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
            <circle cx="150" cy="150" r="128" fill="rgba(255,255,255,.08)" stroke="none"/>
            <path d="M128 70h44M136 70v52l-44 80c-6 12 2 26 16 26h84c14 0 22-14 16-26l-44-80V70"/>
            <path d="M108 180h84l18 32c3 6-1 12-8 12h-104c-7 0-11-6-8-12z" fill="rgba(255,255,255,.22)" stroke="none"/>
            <circle cx="138" cy="198" r="7" fill="#fff" stroke="none"/><circle cx="164" cy="208" r="5" fill="#fff" stroke="none"/>
            <circle cx="152" cy="160" r="4" fill="#fff" stroke="none"/><circle cx="160" cy="140" r="3" fill="#fff" stroke="none"/>
            <rect x="214" y="96" width="18" height="70" rx="9"/><path d="M214 136h18" />
          </svg>
        </div>
        <!-- Centro Pediátrico: oso de peluche con estetoscopio -->
        <div class="ilustracion" style="--angulo: 270deg">
          <svg viewBox="0 0 300 300" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <g id="silueta-oso">
                <ellipse cx="90" cy="192" rx="21" ry="34" transform="rotate(38 90 192)"/>
                <ellipse cx="210" cy="192" rx="21" ry="34" transform="rotate(-38 210 192)"/>
                <ellipse cx="150" cy="208" rx="56" ry="52"/>
                <circle cx="106" cy="248" r="29"/>
                <circle cx="194" cy="248" r="29"/>
                <circle cx="98" cy="76" r="28"/>
                <circle cx="202" cy="76" r="28"/>
                <ellipse cx="150" cy="118" rx="62" ry="56"/>
              </g>
            </defs>
            <circle cx="150" cy="150" r="128" fill="rgba(255,255,255,.08)" stroke="none"/>
            <g transform="translate(150 155) scale(.78) translate(-150 -160)" stroke-width="5">
              <!-- contorno único: trazo grueso tapado por el relleno del tono -->
              <use href="#silueta-oso" stroke-width="10"/>
              <use href="#silueta-oso" class="relleno-tono" stroke="none"/>
              <use href="#silueta-oso" fill="#fff" stroke="none" opacity=".12"/>
              <circle cx="98" cy="76" r="13"/>
              <circle cx="202" cy="76" r="13"/>
              <ellipse cx="150" cy="140" rx="27" ry="21"/>
              <ellipse cx="150" cy="216" rx="30" ry="30"/>
              <circle cx="106" cy="250" r="14"/>
              <circle cx="194" cy="250" r="14"/>
              <circle cx="125" cy="110" r="6" fill="#fff" stroke="none"/>
              <circle cx="175" cy="110" r="6" fill="#fff" stroke="none"/>
              <path d="M141 129h18c3 0 4 3 2 5l-7 7c-2 2-6 2-8 0l-7-7c-2-2-1-5 2-5z" fill="#fff" stroke="none"/>
              <path d="M140 150c4 5 6 5 10 0 4 5 6 5 10 0"/>
              <!-- estetoscopio -->
              <path d="M112 164c0 24 16 36 38 36s38-12 38-36"/>
              <circle cx="112" cy="162" r="5" fill="#fff" stroke="none"/>
              <circle cx="188" cy="162" r="5" fill="#fff" stroke="none"/>
              <path d="M150 200c0 10 8 16 20 16"/>
              <circle cx="182" cy="218" r="12" class="relleno-tono"/>
              <circle cx="182" cy="218" r="4" fill="#fff" stroke="none"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="leyenda">
        <h2 id="leyenda-titulo">Hospital General</h2>
        <p id="leyenda-texto">Internamiento, antecedentes y control estricto de citas.</p>
        <div class="puntos" id="puntos"><i class="activo"></i><i></i><i></i><i></i></div>
      </div>
    </aside>

    <section class="lado-form">
      <div class="marca">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect x="2" y="2" width="36" height="36" rx="10" fill="currentColor"/>
          <path d="M16 10h8v6h6v8h-6v6h-8v-6h-6v-8h6z" fill="#fff"/>
        </svg>
        <div>
          <strong>Red de Salud</strong>
          <span>Plataforma multi-institucional</span>
        </div>
      </div>

      <form id="form-login">
        <div>
          <span class="etiqueta">Institución <b>*</b></span>
          <fieldset class="instituciones">
            <input type="radio" id="i-hospital" name="institucion" value="hospital" checked>
            <label for="i-hospital">Hospital General</label>
            <input type="radio" id="i-odontologia" name="institucion" value="odontologia">
            <label for="i-odontologia">Clínica Odontológica</label>
            <input type="radio" id="i-laboratorio" name="institucion" value="laboratorio">
            <label for="i-laboratorio">Laboratorio Clínico</label>
            <input type="radio" id="i-pediatria" name="institucion" value="pediatria">
            <label for="i-pediatria">Centro Pediátrico</label>
          </fieldset>
        </div>

        <label class="campo">
          <span class="etiqueta">Usuario <b>*</b></span>
          <input name="usuario" autocomplete="username" placeholder="Ingresa tu usuario" required>
        </label>
        <label class="campo">
          <span class="etiqueta">Contraseña <b>*</b></span>
          <input name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
        </label>

        <p class="error" id="login-error" role="alert"></p>
        <button type="submit">Iniciar sesión</button>
      </form>

      <p class="pie">Solo personal autorizado. Cada sesión escribe únicamente en su institución.</p>
    </section>

  </main>

  <script type="module">
    import { login, obtenerSesion, rutaInstitucion, INSTITUCIONES } from './shared/js/api/auth.js';

    const sesion = obtenerSesion();
    if (sesion) location.replace(rutaInstitucion(sesion.institucion));

    const LEYENDAS = {
      hospital:    ['Hospital General', 'Internamiento, antecedentes y control estricto de citas.'],
      odontologia: ['Clínica Odontológica', 'Piezas dentales, tratamientos y seguimiento por paciente.'],
      laboratorio: ['Laboratorio Clínico', 'Órdenes y resultados de hematología, orina y cultivo.'],
      pediatria:   ['Centro Pediátrico', 'Controles de crecimiento, vacunas y tutores.']
    };

    const contenedor = document.querySelector('.login');
    const ruleta = document.getElementById('ruleta');
    const ilustraciones = ruleta.querySelectorAll('.ilustracion');
    const puntos = document.querySelectorAll('#puntos i');
    const form = document.getElementById('form-login');
    const error = document.getElementById('login-error');
    let giro = 0;
    let actual = 0;

    function seleccionar(institucion) {
      const indice = INSTITUCIONES.indexOf(institucion);
      // Gira siempre por el camino más corto (máximo media vuelta)
      let paso = indice - actual;
      if (paso > 2) paso -= 4;
      if (paso < -2) paso += 4;
      giro -= paso * 90;
      actual = indice;

      ruleta.style.transform = `rotate(${giro}deg)`;
      contenedor.dataset.institucion = institucion;
      ilustraciones.forEach((el, i) => el.classList.toggle('activa', i === indice));
      puntos.forEach((el, i) => el.classList.toggle('activo', i === indice));
      const [titulo, texto] = LEYENDAS[institucion];
      document.getElementById('leyenda-titulo').textContent = titulo;
      document.getElementById('leyenda-texto').textContent = texto;
    }

    form.addEventListener('change', (e) => {
      if (e.target.name === 'institucion') seleccionar(e.target.value);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const boton = form.querySelector('button');
      boton.disabled = true;
      try {
        const { institucion } = await login(Object.fromEntries(new FormData(form)));
        location.assign(rutaInstitucion(institucion));
      } catch (err) {
        error.textContent = err.message;
      } finally {
        boton.disabled = false;
      }
    });
  </script>

</body>
</html>
