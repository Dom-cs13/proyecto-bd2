<div class="view-gestion-pacientes">
  <div>
    <span class="welcome-badge">Operaciones · Altas y Bajas</span>
    <h1 class="page-main-title">Registro y Archivado de Pacientes</h1>
    <p class="section-desc">Registra pacientes nuevos o archiva un expediente con motivo formal; el historial de exámenes se conserva.</p>
  </div>
  <div class="gestion-grid-layout">
    <div class="kpi-card">
      <h2 class="section-title" style="margin-bottom:16px">➕ Alta de Paciente</h2>
      <form id="form-paciente" class="form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">CUI *</label>
            <input name="cui" class="form-control" required inputmode="numeric" pattern="\d{13}" minlength="13" maxlength="13" placeholder="13 dígitos" title="13 dígitos numéricos">
          </div>
          <div class="form-group"><label class="form-label">Fecha de nacimiento *</label><input name="fechaNacimiento" type="date" class="form-control" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Nombre(s) *</label><input name="nombre" class="form-control" required></div>
          <div class="form-group"><label class="form-label">Apellidos *</label><input name="apellidos" class="form-control" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Género *</label><select name="genero" id="sel-genero" class="form-control"></select></div>
          <div class="form-group"><label class="form-label">Tipo de sangre *</label><select name="tipoSangre" id="sel-sangre" class="form-control"></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Teléfono</label><input name="telefono" type="tel" class="form-control" placeholder="+502 ..."></div>
          <div class="form-group"><label class="form-label">Dirección</label><input name="direccion" class="form-control" placeholder="Zona, Municipio, Departamento"></div>
        </div>
        <div class="form-group"><label class="form-label">Alergias (separadas por coma)</label><input name="alergias" class="form-control" placeholder="Ej. Penicilina, Látex"></div>
        <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" type="submit">💾 Registrar Paciente</button></div>
      </form>
    </div>
    <div class="kpi-card">
      <h2 class="section-title" style="color:#b91c1c;margin-bottom:6px">🗂️ Archivado Justificado</h2>
      <p class="section-desc" style="margin-bottom:12px">Un expediente solo se archiva por traslado, fallecimiento o baja administrativa.</p>
      <div id="lista-archivar"></div>
    </div>
  </div>
</div>
