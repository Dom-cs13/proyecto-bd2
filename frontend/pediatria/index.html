<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro Pediátrico · Alba Suite</title>
  
  <!-- Estilos modulares desacoplados -->
  <link rel="stylesheet" href="../shared/css/fuentes.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <a class="skip-link" href="#main-viewport">Saltar al contenido principal</a>

  <div class="app-container">
    <!-- Sidebar Izquierdo Modular Pediátrico -->
    <aside id="sidebar-container" class="app-sidebar" aria-label="Navegación institucional"></aside>

    <!-- Área Principal de la Aplicación -->
    <main class="app-main">
      <!-- Barra Superior de Navegación Rápida -->
      <header class="top-navbar">
        <div class="top-nav-left">
          <div class="top-nav-breadcrumb">
            <span>Centro Pediátrico</span>
            <span>/</span>
            <strong id="seccion-actual">Panel Principal</strong>
          </div>
        </div>

        <div class="top-nav-right">
          <button id="topnav-btn-principal" class="btn btn-outline btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Principal</span>
          </button>
          <button id="topnav-btn-buscador" class="btn btn-outline btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Buscador</span>
          </button>
          <button id="topnav-btn-nuevo" class="btn btn-cta btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>+ Nuevo Paciente</span>
          </button>
        </div>
      </header>

      <!-- Viewport Dinámico donde se cargan las vistas de /pages/ -->
      <section id="main-viewport" class="content-viewport" tabindex="-1"></section>
    </main>
  </div>

  <!-- Contenedor del Drawer / Panel Flotante para Consultas y Edición -->
  <div id="drawer-container"></div>

  <!-- Aplicación JS Principal (Arquitectura SPA modular) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
